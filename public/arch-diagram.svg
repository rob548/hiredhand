<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <style>
    text { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  </style>
  <!-- blueprint dot grid -->
  <g fill="#DDD3BF">
    <circle cx="100" cy="80" r="1.6"/><circle cx="240" cy="80" r="1.6"/><circle cx="380" cy="80" r="1.6"/><circle cx="520" cy="80" r="1.6"/><circle cx="660" cy="80" r="1.6"/><circle cx="800" cy="80" r="1.6"/><circle cx="940" cy="80" r="1.6"/><circle cx="1080" cy="80" r="1.6"/>
    <circle cx="100" cy="740" r="1.6"/><circle cx="240" cy="740" r="1.6"/><circle cx="380" cy="740" r="1.6"/><circle cx="520" cy="740" r="1.6"/><circle cx="660" cy="740" r="1.6"/><circle cx="800" cy="740" r="1.6"/><circle cx="940" cy="740" r="1.6"/><circle cx="1080" cy="740" r="1.6"/>
  </g>
  <!-- corner ticks -->
  <g stroke="#191512" stroke-width="1.5" opacity="0.7">
    <path d="M60 100V60h40M1140 60h-40v40M60 700v40h40M1140 740h-40v-40"/>
  </g>
  <!-- ===== box 1: your machine ===== -->
  <g>
    <rect x="330.5" y="70.5" width="540" height="150" rx="14" stroke="#191512" stroke-width="1.6" fill="#F5F0E6" fill-opacity="0.6" transform="rotate(-0.3 600 145)"/>
    <text x="368" y="118" font-size="20" letter-spacing="3" fill="#191512">YOUR MACHINE</text>
    <text x="368" y="150" font-size="14" fill="#57504A">~/hiredhand · vault · audit.log</text>
    <text x="368" y="178" font-size="14" fill="#8C8378">credentials never leave this box</text>
    <text x="838" y="118" font-size="14" fill="#E8501E" text-anchor="end">01</text>
  </g>
  <!-- dashed connector 1 with padlock -->
  <g stroke="#191512" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.8">
    <path d="M600 224 C 598 250, 602 270, 600 292"/>
  </g>
  <g>
    <rect x="585" y="244" width="30" height="24" rx="4" stroke="#E8501E" stroke-width="1.8" fill="#F5F0E6"/>
    <path d="M591 244v-6a9 9 0 0 1 18 0v6" stroke="#E8501E" stroke-width="1.8" fill="none"/>
    <circle cx="600" cy="256" r="2.6" fill="#E8501E"/>
  </g>
  <text x="636" y="262" font-size="13" fill="#8C8378">scoped tokens only</text>
  <!-- ===== box 2: sandboxed containers ===== -->
  <g>
    <rect x="250.5" y="296.5" width="700" height="190" rx="14" stroke="#191512" stroke-width="1.6" fill="#EDE6D6" fill-opacity="0.5" transform="rotate(0.25 600 390)"/>
    <text x="288" y="342" font-size="20" letter-spacing="3" fill="#191512">SANDBOXED CONTAINERS</text>
    <text x="288" y="372" font-size="14" fill="#57504A">docker · e2b · daytona — one computer per bot</text>
    <text x="918" y="342" font-size="14" fill="#E8501E" text-anchor="end">02</text>
    <!-- inner bot cells -->
    <g stroke="#191512" stroke-width="1.4" fill="#F5F0E6">
      <rect x="290" y="396" width="190" height="60" rx="10" transform="rotate(-0.4 385 426)"/>
      <rect x="505" y="396" width="190" height="60" rx="10" transform="rotate(0.5 600 426)"/>
      <rect x="720" y="396" width="190" height="60" rx="10" transform="rotate(-0.3 815 426)"/>
    </g>
    <text x="310" y="432" font-size="13" fill="#57504A">bot: inbox-manager</text>
    <text x="525" y="432" font-size="13" fill="#57504A">bot: bug-triage</text>
    <text x="740" y="432" font-size="13" fill="#57504A">bot: sales-outbound</text>
  </g>
  <!-- dashed connector 2 with padlock -->
  <g stroke="#191512" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.8">
    <path d="M600 490 C 602 516, 598 538, 600 560"/>
  </g>
  <g>
    <rect x="585" y="512" width="30" height="24" rx="4" stroke="#E8501E" stroke-width="1.8" fill="#F5F0E6"/>
    <path d="M591 512v-6a9 9 0 0 1 18 0v6" stroke="#E8501E" stroke-width="1.8" fill="none"/>
    <circle cx="600" cy="524" r="2.6" fill="#E8501E"/>
  </g>
  <text x="636" y="530" font-size="13" fill="#8C8378">your api keys · your spend</text>
  <!-- ===== box 3: model providers ===== -->
  <g>
    <rect x="330.5" y="564.5" width="540" height="150" rx="14" stroke="#191512" stroke-width="1.6" fill="#F5F0E6" fill-opacity="0.6" transform="rotate(0.35 600 640)"/>
    <text x="368" y="612" font-size="20" letter-spacing="3" fill="#191512">MODEL PROVIDERS</text>
    <text x="368" y="644" font-size="14" fill="#57504A">claude · gpt · grok · gemini · openrouter · local</text>
    <text x="368" y="672" font-size="14" fill="#8C8378">swap per bot, anytime</text>
    <text x="838" y="612" font-size="14" fill="#E8501E" text-anchor="end">03</text>
  </g>
  <!-- side annotations -->
  <g stroke="#E8501E" stroke-width="1.4" fill="none">
    <path d="M872 145h70"/>
    <path d="M952 391h70"/>
  </g>
  <text x="950" y="132" font-size="13" fill="#E8501E" text-anchor="end">trust boundary ▸</text>
  <text x="950" y="378" font-size="13" fill="#E8501E" text-anchor="end">approvals hold here ▸</text>
  <text x="600" y="770" font-size="13" fill="#8C8378" text-anchor="middle" letter-spacing="2">fig. 01 — everything inside the dashed lines is yours</text>
</svg>
